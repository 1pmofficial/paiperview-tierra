name: Refresh PPV Playlist

on:
  schedule:
    - cron: '0 */2 * * *'   # Every 2 hours (adjust as needed, GitHub cron uses UTC)
  workflow_dispatch:          # Allow manual triggering

permissions:
  contents: write             # Needed to commit files back to the repository

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps   # Install browser + system dependencies [citation:1][citation:5]

      - name: Run script
        run: python3 fetch-streams.py ppv-streams.m3u

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ppv-streams.m3u
          git commit -m "Update PPV playlist $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push
